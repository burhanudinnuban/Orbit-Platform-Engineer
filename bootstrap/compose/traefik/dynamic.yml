# Edge routes on 127.0.0.1:${ORBIT_INGRESS_PORT} (Traefik file provider). The
# whole file is a Go template, comments included: env reads ORBIT_BASE_DOMAIN
# from the container. Platform hosts go to their containers.
# Every other host, such as <app>-<env>.localtest.me, goes to the in-cluster
# Traefik on the k3s node, which routes by the apps' Ingress objects.
# Traefik ignores the port when it matches Host.
http:
  routers:
    gitea:
      entryPoints: [web]
      rule: 'Host(`git.{{ env "ORBIT_BASE_DOMAIN" }}`)'
      service: gitea
    grafana:
      entryPoints: [web]
      rule: 'Host(`grafana.{{ env "ORBIT_BASE_DOMAIN" }}`)'
      service: grafana
    prometheus:
      entryPoints: [web]
      rule: 'Host(`prometheus.{{ env "ORBIT_BASE_DOMAIN" }}`)'
      service: prometheus
    floci:
      entryPoints: [web]
      rule: 'Host(`aws.{{ env "ORBIT_BASE_DOMAIN" }}`)'
      service: floci
    cluster:
      entryPoints: [web]
      rule: 'PathPrefix(`/`)'
      priority: 1
      service: cluster

  services:
    gitea:
      loadBalancer:
        servers:
          - url: http://gitea:3000
    grafana:
      loadBalancer:
        servers:
          - url: http://grafana:3000
    prometheus:
      loadBalancer:
        servers:
          - url: http://prometheus:9090
    floci:
      loadBalancer:
        servers:
          - url: http://floci:4566
    cluster:
      loadBalancer:
        servers:
          - url: http://k3s:80
