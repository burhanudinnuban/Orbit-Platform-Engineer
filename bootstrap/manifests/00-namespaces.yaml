apiVersion: v1
kind: Namespace
metadata:
  name: orbit-system
  labels:
    app.kubernetes.io/managed-by: orbit
    app.kubernetes.io/part-of: orbit
---
# Pipeline jobs run here. BuildKit needs privileged pods, so this namespace
# (and only this namespace) allows them.
apiVersion: v1
kind: Namespace
metadata:
  name: orbit-ci
  labels:
    app.kubernetes.io/managed-by: orbit
    app.kubernetes.io/part-of: orbit
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
