# Prometheus: scrapes annotated pods and cAdvisor. Orbit writes per-app alert
# rules into ConfigMap prometheus-rules, which bootstrap/up.mjs creates only if
# it is missing so re-running the bootstrap never wipes those rules. A busybox
# sidecar calls /-/reload whenever the mounted config or rules change.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: orbit-system
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/managed-by: orbit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orbit-prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/managed-by: orbit
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "nodes/metrics", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orbit-prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/managed-by: orbit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: orbit-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: orbit-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: orbit-system
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/managed-by: orbit
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: orbit

    rule_files:
      - /etc/prometheus/rules/*.yaml

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      # Any pod annotated prometheus.io/scrape: "true" (Orbit app templates are).
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_phase]
            action: drop
            regex: Pending|Succeeded|Failed
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_label_orbit_dev_env]
            target_label: env

      # Container CPU and memory (container_cpu_usage_seconds_total,
      # container_memory_working_set_bytes) through the API server node proxy.
      - job_name: kubernetes-cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: orbit-system
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/managed-by: orbit
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: orbit-system
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/managed-by: orbit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/config/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --web.enable-lifecycle
            - --web.external-url=http://prometheus.localtest.me:8080/
            - --web.route-prefix=/
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/config
              readOnly: true
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: data
              mountPath: /prometheus
        - name: config-reloader
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              # Reload Prometheus whenever the mounted config or rules change.
              # Globs follow the ConfigMap symlinks, so this hashes the live files.
              hash() { cat /etc/prometheus/config/* /etc/prometheus/rules/* 2>/dev/null | md5sum | cut -d' ' -f1; }
              last="$(hash)"
              echo "config-reloader: watching (hash $last)"
              while true; do
                sleep 10
                current="$(hash)"
                if [ "$current" != "$last" ]; then
                  if wget -q -O /dev/null --post-data='' http://127.0.0.1:9090/-/reload; then
                    echo "config-reloader: reloaded (hash $current)"
                    last="$current"
                  else
                    echo "config-reloader: reload failed, retrying"
                  fi
                fi
              done
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/config
              readOnly: true
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
            optional: true
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: orbit-system
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/managed-by: orbit
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus
  namespace: orbit-system
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/managed-by: orbit
spec:
  ingressClassName: traefik
  rules:
    - host: prometheus.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  name: http
