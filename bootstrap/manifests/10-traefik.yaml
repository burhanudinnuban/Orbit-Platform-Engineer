# Traefik as the cluster ingress controller, using only the Kubernetes Ingress
# provider (no CRDs). It binds hostPort 80 on the kind node labeled
# ingress-ready=true; kind maps that to 127.0.0.1:8080 on the host.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: orbit-system
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/managed-by: orbit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orbit-traefik
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/managed-by: orbit
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "secrets", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orbit-traefik
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/managed-by: orbit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: orbit-traefik
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: orbit-system
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: traefik
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/managed-by: orbit
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: traefik.io/ingress-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: orbit-system
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/managed-by: orbit
spec:
  replicas: 1
  # hostPort 80 can only be bound by one pod per node, so never surge.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traefik
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: traefik
      nodeSelector:
        ingress-ready: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: traefik
          image: traefik:v3.1.2
          args:
            - --entrypoints.web.address=:80
            - --entrypoints.traefik.address=:9000
            - --entrypoints.metrics.address=:9100
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.ingressclass=traefik
            - --providers.kubernetesingress.ingressendpoint.ip=127.0.0.1
            - --ping=true
            - --ping.entrypoint=traefik
            - --metrics.prometheus=true
            - --metrics.prometheus.entrypoint=metrics
            - --log.level=INFO
            - --accesslog=true
            - --global.checknewversion=false
            - --global.sendanonymoususage=false
          ports:
            - name: web
              containerPort: 80
              hostPort: 80
              protocol: TCP
            - name: admin
              containerPort: 9000
              protocol: TCP
            - name: metrics
              containerPort: 9100
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ping
              port: admin
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: orbit-system
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/managed-by: orbit
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - name: web
      port: 80
      targetPort: web
    - name: admin
      port: 9000
      targetPort: admin
