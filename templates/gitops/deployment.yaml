# Rendered by the Orbit GitOps controller: every placeholder is a key of
# values.yaml in the same directory, substituted as text before YAML parsing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${app}
  namespace: ${namespace}
  labels:
    app.kubernetes.io/name: "${app}"
    orbit.dev/app: "${app}"
    orbit.dev/env: "${env}"
    orbit.dev/team: "${team}"
spec:
  replicas: ${replicas}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: "${app}"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "${app}"
        orbit.dev/app: "${app}"
        orbit.dev/env: "${env}"
        orbit.dev/team: "${team}"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "${port}"
        prometheus.io/path: /metrics
        orbit.dev/revision: "${revision}"
    spec:
      serviceAccountName: ${app}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "${image}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: ${port}
              protocol: TCP
          env:
            - name: PORT
              value: "${port}"
            - name: ORBIT_ENV
              value: "${env}"
            - name: ORBIT_APP
              value: "${app}"
          envFrom:
            # Created by Terraform only when the app has a database.
            - secretRef:
                name: ${app}-db
                optional: true
            # Created by Orbit only when the app has an S3 bucket or SQS queue:
            # AWS_REGION, AWS_ENDPOINT_URL (Floci), S3_BUCKET, SQS_QUEUE_URL...
            - secretRef:
                name: ${app}-aws
                optional: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "${cpuRequest}"
              memory: "${memoryRequest}"
            limits:
              cpu: "${cpuLimit}"
              memory: "${memoryLimit}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
