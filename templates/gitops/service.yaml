apiVersion: v1
kind: Service
metadata:
  name: ${app}
  namespace: ${namespace}
  labels:
    app.kubernetes.io/name: "${app}"
    orbit.dev/app: "${app}"
    orbit.dev/env: "${env}"
    orbit.dev/team: "${team}"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: "${app}"
  ports:
    - name: http
      port: 80
      targetPort: ${port}
      protocol: TCP
