apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${app}
  namespace: ${namespace}
  labels:
    app.kubernetes.io/name: "${app}"
    orbit.dev/app: "${app}"
    orbit.dev/env: "${env}"
    orbit.dev/team: "${team}"
spec:
  ingressClassName: traefik
  rules:
    - host: "${host}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${app}
                port:
                  name: http
